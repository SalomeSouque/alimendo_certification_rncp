name: CD (images Docker)

# Workflow réutilisable, appelé par ci.yml UNIQUEMENT quand le lint et les tests
# sont passés, et seulement sur un push (jamais sur une pull request).
# Pourquoi pas `on: workflow_run` ? Ce déclencheur ne lit que la version du fichier
# présente sur la branche par défaut (main), qui ne contient pas encore ce workflow.
#
# Produit, pour chaque commit poussé sur develop ou main :
#   ghcr.io/salomesouque/alimendo-api:sha-<7 caractères>       + :<branche>
#   ghcr.io/salomesouque/alimendo-frontend:sha-<7 caractères>  + :<branche>
# Le tag sha-xxxxxxx est immuable : c'est lui qu'on déploie et vers lequel on revient.
#
# Prérequis GitHub : variable de dépôt VITE_API_URL (Settings > Secrets and variables >
# Actions > Variables), par exemple https://ton-domaine.fr/api

on:
  workflow_call:

jobs:
  build-push:
    name: Image ${{ matrix.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
          - name: frontend
            context: frontend

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN suffit pour publier sur le registre du dépôt : aucun secret à créer.
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/salomesouque/alimendo-${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Ignorés par l'image api, lus par l'image frontend (figés dans le bundle).
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_AUTH_MOCK=false
          # Cache GitHub Actions : l'image api (torch + modèle e5) est longue à construire.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
