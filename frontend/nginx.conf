server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Security headers (OWASP A05, security misconfiguration). The Content-Security-Policy
  # of the pages is in index.html (vite.config.js): it needs the API address.
  # HTTPS and HSTS are handled by the reverse proxy (Traefik).
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # The site may not be shown inside another site's frame (clickjacking).
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "frame-ancestors 'none'" always;
  # Only the site itself may ask for the camera (barcode scan); nothing else.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
