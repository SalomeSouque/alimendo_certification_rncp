<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Alimendo</title>
  <link rel="icon" href="/_maintenance/Logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Page autonome, servie par nginx quand l'app est arrêtée : elle ne peut pas
       charger le CSS de Vite. Valeurs reprises de frontend/src/styles/common.css
       et de Authentification.css : à garder alignées si la charte change. */
    :root {
      --bg: #fafaf8;
      --ink: #1e2423;
      --muted: #5a6960;
      --muted-2: #7a8a83;
      --border: #d4ddd8;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { overflow-x: clip; }

    body {
      font-family: 'Poppins', system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--ink);
    }

    .frame {
      position: relative;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 48px 16px;
    }

    /* Trait jaune : même asset et même placement que la page d'authentification (.wave-auth). */
    .wave {
      position: absolute;
      z-index: 0;
      top: 112px;
      left: -5%;
      width: 112%;
      height: auto;
      pointer-events: none;
      user-select: none;
    }

    /* Encadré : style de .auth-card, dimensions de la maquette. */
    .card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 648px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(30, 36, 35, 0.08);
      padding: 20px 20px 16px;
      text-align: center;
    }

    .logo { display: block; width: 164px; height: 164px; margin: 0 auto; }
    .logo img { display: block; width: 100%; height: 100%; }

    /* Reprend .header-tagline (sans la bordure). */
    .tagline { margin-top: 20px; font-size: 14px; color: var(--muted-2); }

    /* Texte courant du site : .hero-description / .section-body. */
    .message {
      margin: 56px auto 88px;
      max-width: 545px;
      font-size: 19px;
      line-height: 1.55;
      color: var(--muted);
    }

    /* Reprend .footer-copyright. */
    .copyright { font-size: 13px; color: var(--muted-2); }

    @media (min-width: 600px) {
      .card { padding: 20px 44px 16px; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <img class="wave" src="/_maintenance/yellow_line_identification_page.svg" alt="" aria-hidden="true">

    <main class="card">
      <h1 class="logo"><img src="/_maintenance/Logo.svg" alt="Alimendo"></h1>
      <p class="tagline">alimentation &amp; endométriose, en clair</p>

      <p class="message">Le site est en cours de mise en ligne. Revenez bientôt.</p>

      <p class="copyright">© 2026 Alimendo - Projet étudiant</p>
    </main>
  </div>
</body>
</html>
