# Page de repli Alimendo : toute requête reçoit 503 + Retry-After,
# sauf les images de la page elle-même (logo, trait jaune) servies en 200.
# 503 = « temporairement indisponible » : les moteurs de recherche n'indexent pas la page.
server {
    listen 80;
    root /usr/share/nginx/html;

    error_page 503 /index.html;
    location = /index.html { internal; }

    # Images de la page (deploy/maintenance/assets/, montées en lecture seule).
    # Préfixe dédié : aucune confusion avec les /assets/ de l'application.
    location /_maintenance/ {
        alias /usr/share/nginx/maintenance-assets/;
        expires 1h;
    }

    location / {
        add_header Retry-After 3600 always;
        return 503;
    }
}
