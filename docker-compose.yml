name: alimendo

services:
  db: 
    image: postgres:17-alpine
    env_file: 
      - .env
    ports: 
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" 
    volumes: 
      - pgdata:/var/lib/postgresql/data 
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
     interval: 10s 
     timeout: 5s
     retries: 5
  chromadb: 
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports: 
      - "127.0.0.1:${CHROMADB_PORT:-8001}:8000" 
    volumes: 
      - chroma_data:/data

  # VLM de reconnaissance photo (Qwen3-VL). Qwen3-VL exige Ollama >= 0.12.7
  # (https://ollama.com/library/qwen3-vl). Version épinglée, jamais latest.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.40.12
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      # Garde le modèle chargé en VRAM 10 min après la dernière photo.
      OLLAMA_KEEP_ALIVE: "10m"
      # 6 Go de VRAM : un seul modèle chargé à la fois.
      OLLAMA_MAX_LOADED_MODELS: "1"
    # Sans cette réservation, Ollama tourne sur le CPU, sans aucune erreur.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - api
  
  api:
    profiles: ["app"]
    build: ./backend 
    ports:
      - "127.0.0.1:${FASTAPI_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_started
    env_file:
      - .env

volumes:
  pgdata:
  chroma_data:
  ollama_models: