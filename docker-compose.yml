name: alimendo

services:
  db: 
    image: postgres:17-alpine
    env_file: 
      - .env
    ports : 
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432" 
    volumes: 
      - pgdata:/var/lib/postgresql/data 
    healthcheck:
     test: ["CMD-SHELL", "pg_isready -U alimendo -d alimendo"]
     interval: 10s 
     timeout: 5s
     retries: 5

volumes:
  pgdata: