[project]
name = "alimendo-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.3.5",
    "pydantic[email]>=2.0",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.2.3",
    "httpx>=0.28.1",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.0.1",
    "scikit-learn==1.9.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.6",
]
